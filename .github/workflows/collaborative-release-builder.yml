name: Collaborative Release Builder

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release name (example: sprint-10). Reuse the same name and commits to resume after resolving a conflict."
        required: true
        type: string
      ticket_1:
        description: "Ticket and its commits, e.g. 20: 6569375 b44a336 (leave unused slots empty)"
        required: false
        type: string
      ticket_2:
        description: "Ticket and its commits"
        required: false
        type: string
      ticket_3:
        description: "Ticket and its commits"
        required: false
        type: string
      ticket_4:
        description: "Ticket and its commits"
        required: false
        type: string
      ticket_5:
        description: "Ticket and its commits"
        required: false
        type: string
      ticket_6:
        description: "Ticket and its commits"
        required: false
        type: string
      ticket_7:
        description: "Ticket and its commits"
        required: false
        type: string
      ticket_8:
        description: "Ticket and its commits"
        required: false
        type: string
      ticket_9:
        description: "Ticket and its commits"
        required: false
        type: string
      ticket_10:
        description: "Ticket and its commits"
        required: false
        type: string
      approved_hotfix_commits:
        description: "Optional approved hotfix commit SHAs, comma or whitespace separated"
        required: false
        type: string
      tested_by_dev1:
        description: "Developer 1 has tested and approved this release candidate"
        required: true
        default: false
        type: boolean
      tested_by_dev2:
        description: "Developer 2 has tested and approved this release candidate"
        required: true
        default: false
        type: boolean
      tested_by_dev3:
        description: "Developer 3 has tested and approved this release candidate"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: collaborative-release-${{ inputs.release_name }}
  cancel-in-progress: false

jobs:
  assemble:
    if: ${{ !inputs.tested_by_dev1 && !inputs.tested_by_dev2 && !inputs.tested_by_dev3 }}
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.meta.outputs.branch }}
    steps:
      - name: Checkout latest main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Assemble tickets oldest-first (AI resolves conflicts)
        id: meta
        env:
          WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: |
          python scripts/assemble_release.py --from-workflow-inputs --ai \
            --pr-body "$RUNNER_TEMP/release-pr-body.md"

      - name: Run release tests
        run: bash scripts/release_check.sh

      - name: Push release branch
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
        run: git push origin "HEAD:release/$RELEASE_NAME"

      - name: Create release PR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          body="$RUNNER_TEMP/release-pr-body.md"
          existing="$(gh pr list --base main --head "release/$RELEASE_NAME" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh pr edit "$existing" --title "Release: ${RELEASE_NAME}" --body-file "$body"
          else
            gh pr create --base main --head "release/$RELEASE_NAME" \
              --title "Release: ${RELEASE_NAME}" --body-file "$body"
          fi

  record_testing:
    if: ${{ inputs.tested_by_dev1 || inputs.tested_by_dev2 || inputs.tested_by_dev3 }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate release PR and record approvals
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ inputs.release_name }}
          TESTED1: ${{ inputs.tested_by_dev1 }}
          TESTED2: ${{ inputs.tested_by_dev2 }}
          TESTED3: ${{ inputs.tested_by_dev3 }}
        run: |
          set -euo pipefail
          branch="release/$RELEASE_NAME"
          pr="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "::error::No open PR found for $branch. Run the assembly workflow first."
            exit 1
          fi

          # This checkbox-style input is only an audit convenience, not strong identity proof.
          # Configure required approving reviews / CODEOWNERS for enforced approval by each person.
          body="$(gh pr view "$pr" --json body --jq .body)"
          if [ "$TESTED1" = "true" ]; then body="$(printf '%s' "$body" | sed 's/- \[ \] Developer 1 tested/- [x] Developer 1 tested/')"; fi
          if [ "$TESTED2" = "true" ]; then body="$(printf '%s' "$body" | sed 's/- \[ \] Developer 2 tested/- [x] Developer 2 tested/')"; fi
          if [ "$TESTED3" = "true" ]; then body="$(printf '%s' "$body" | sed 's/- \[ \] Developer 3 tested/- [x] Developer 3 tested/')"; fi
          printf '%s\n' "$body" > /tmp/pr-body.md
          gh pr edit "$pr" --body-file /tmp/pr-body.md
          echo "Updated test checklist on PR #$pr. Actual GitHub review approvals should be required in branch protection."
