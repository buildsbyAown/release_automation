<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fresh Market</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">Fresh Market</h1>
    <nav class="nav">
      <a href="#products">Products</a>
      <a href="#about">About</a>
    </nav>
    <span id="cart-count" class="cart-count">Cart: 0</span>
  </header>

  <main>
    <section id="products">
      <h2>Products</h2>
      <div id="product-grid" class="product-grid"></div>
    </section>

    <aside id="cart-panel" class="cart-panel">
      <h2>Your cart</h2>
      <ul id="cart-items" class="cart-items"></ul>
      <p class="cart-total">Total: $<span id="cart-total">0.00</span></p>
    </aside>

    <section id="about">
      <h2>About</h2>
      <p>Fresh produce and bakery goods delivered from local farms.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Fresh Market</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
